name: hookship-evaluation

services:
  hookshipd:
    profiles:
      - evaluation
    build:
      context: .
      args:
        VERSION: evaluation
        COMMIT: local
        BUILD_DATE: unknown
    environment:
      HOOKSHIP_LISTEN_ADDRESS: 0.0.0.0:8080
      HOOKSHIP_LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /hookshipctl
        - diagnostics
        - -url=http://127.0.0.1:8080
        - -timeout=2s
      interval: 10s
      timeout: 3s
      start_period: 2s
      retries: 3
    stop_grace_period: 15s
    restart: "no"
