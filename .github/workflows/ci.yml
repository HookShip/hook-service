name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Install independent JSON Schema validator
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-input
          --requirement requirements-spec.txt

      - name: Run repository checks
        run: make ci

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          echo "${sha}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$asset" gitleaks
          gitleaks version

      - name: Scan for secrets
        run: make gitleaks

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: hookship_test
          POSTGRES_PASSWORD: hookship_test
          POSTGRES_USER: hookship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookship -d hookship_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hookship:hookship_test@127.0.0.1:5432/hookship_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      MINIO_TEST_ENDPOINT: 127.0.0.1:9000
      MINIO_TEST_BUCKET: hookship-payloads
      MINIO_TEST_ACCESS_KEY: hookshipminio
      MINIO_TEST_SECRET_KEY: hookshipminio_ci
      MINIO_TEST_REGION: us-east-1
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Start MinIO object store
        run: |
          set -euo pipefail
          docker run -d --name minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=hookshipminio \
            -e MINIO_ROOT_PASSWORD=hookshipminio_ci \
            quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint sh \
            quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c "mc alias set ci http://127.0.0.1:9000 hookshipminio hookshipminio_ci && mc mb --ignore-existing ci/hookship-payloads"

      - name: Run migration and durability integration tests
        run: make migration-check test-integration

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE=unknown \
            --tag hookship/hook-service:ci \
            .
