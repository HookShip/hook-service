name: hookship-deploy

# Single-VM durable deployment that PULLS a published hookshipd image.
#
# HOOKSHIP_IMAGE MUST be an immutable digest reference (…@sha256:…). This
# repository invents no registry or tag; supply the exact digest your release
# workflow published. deploy/scripts/compose-up.sh enforces the digest before
# starting, so a mutable tag reference is rejected.
#
# Configure by copying .env.example to .env and replacing every REPLACE_ME
# value (including HOOKSHIP_IMAGE), then:
#   deploy/scripts/compose-up.sh pull

x-hookshipd-hardening: &hookshipd-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: hookship
      POSTGRES_USER: hookship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hookship", "-d", "hookship"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - hookship-postgres:/var/lib/postgresql/data
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: ${HOOKSHIP_IMAGE:?set HOOKSHIP_IMAGE to an immutable ...@sha256:... digest}
    entrypoint: ["/hookshipctl"]
    command: ["migrate"]
    env_file: [./.env]
    environment:
      HOOKSHIP_BACKEND: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hookshipd:
    image: ${HOOKSHIP_IMAGE:?set HOOKSHIP_IMAGE to an immutable ...@sha256:... digest}
    <<: *hookshipd-hardening
    command: ["all"]
    env_file: [./.env]
    environment:
      HOOKSHIP_BACKEND: postgres
    volumes:
      - ./assignments.yaml:/etc/hookship/assignments.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  hookship-postgres:
